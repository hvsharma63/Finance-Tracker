# Self-hosted deployment. All ports bind to 127.0.0.1 by default.
# To expose on a trusted LAN interface, set BIND_ADDRESS in .env (see docs/SECURITY.md).
name: finance-tracker

services:
  db:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finance}
      POSTGRES_USER: ${POSTGRES_USER:-finance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/db-init:/docker-entrypoint-initdb.d:ro
    # Exposed only on loopback, for local development and tests. Never publish publicly.
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finance} -d ${POSTGRES_DB:-finance}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-finance}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-finance}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      STORAGE_DIR: /data/statements
      BACKUP_DIR: /data/backups
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      OCR_ENABLED: ${OCR_ENABLED:-true}
    volumes:
      - statements:/data/statements
      - backups:/data/backups
    expose:
      - "8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8420}:80"

volumes:
  pgdata:
  statements:
  backups:
